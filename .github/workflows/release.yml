# v로 시작하는 태그(예: v0.4.0)를 푸시하면 Windows 설치 파일을 빌드·서명해서 초안(draft) 릴리스로 올린다.
# 초안을 확인하고 "Publish"를 눌러야 사용자 앱에 업데이트가 뜬다 (latest.json은 공개된 최신 릴리스에서만 읽힌다).
#
# 필요한 저장소 Secrets:
#   TAURI_SIGNING_PRIVATE_KEY           업데이트 서명 개인키 (파일 내용 전체)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  그 키의 비밀번호
#
# 릴리스 노트는 RELEASE_NOTES.md에서 읽는다. 앱의 업데이트 안내 "What's new"에도 이 내용이 나온다.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check versions match the tag
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($conf -ne $tag -or $pkg -ne $tag) { throw "Tag ${tag}, tauri.conf.json ${conf}, package.json ${pkg}: versions differ" }

      - name: Check the updater public key is set
        shell: pwsh
        run: |
          if ((Get-Content src-tauri/tauri.conf.json -Raw) -match "REPLACE_WITH_UPDATER_PUBKEY") { throw "Put the updater public key in tauri.conf.json (plugins.updater.pubkey)" }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Read release notes
        id: notes
        shell: pwsh
        run: |
          $body = if (Test-Path RELEASE_NOTES.md) { Get-Content RELEASE_NOTES.md -Raw } else { "" }
          $eof = "EOF_$([guid]::NewGuid().ToString('N'))"
          "body<<$eof`n$body`n$eof" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: PlushBounce __VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          includeUpdaterJson: true
